name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    if: >-
      github.repository == 'ryanshepps/gordie' &&
      github.actor == 'ryanshepps' &&
      github.triggering_actor == 'ryanshepps' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Read Commitizen version
        id: package
        run: |
          version="$(uv run cz version --project)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build

      - name: Verify installed wheel
        run: uv run python scripts/check_package.py dist/*.whl

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA"
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
            --verify-tag \
            --title "Gordie $RELEASE_TAG" \
            --generate-notes
